name: Agent change log

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-change-log-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-change-log:
    name: Require agent change log
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the change being reviewed
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Test change-log enforcement
        run: node --test scripts/check-agent-log.test.mjs

      - name: Require appended maintenance records
        env:
          AGENT_LOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AGENT_LOG_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-agent-log.mjs --base "$AGENT_LOG_BASE" --head "$AGENT_LOG_HEAD"
