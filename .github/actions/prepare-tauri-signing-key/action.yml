name: Prepare Tauri signing key
description: Normalize and mask the required independent Tauri updater signing key.
inputs:
  private-key:
    description: TAURI_SIGNING_PRIVATE_KEY secret
    required: true
  password:
    description: TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Prepare required updater signing key
      shell: bash
      env:
        RAW: ${{ inputs.private-key }}
        KEY_PASSWORD: ${{ inputs.password }}
      run: |
        set +x
        set -euo pipefail
        node --input-type=module <<'NODE'
        import { appendFileSync } from 'node:fs';
        import { randomUUID } from 'node:crypto';
        const mask = (value) => {
          if (value) console.log(`::add-mask::${value.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A')}`);
        };
        const raw = (process.env.RAW ?? '').trim().replaceAll('\r', '');
        const password = process.env.KEY_PASSWORD ?? '';
        mask(raw);
        mask(password);
        if (!raw) throw new Error('TAURI_SIGNING_PRIVATE_KEY is required for every release and dry run.');
        const isBase64 = (value) => /^[A-Za-z0-9+/]+={0,2}$/.test(value) && value.length % 4 === 0;
        let key = raw;
        if (!key.startsWith('untrusted comment:')) {
          if (!isBase64(raw)) throw new Error('Unrecognized updater signing key format.');
          const decoded = Buffer.from(raw, 'base64').toString('utf8');
          key = decoded.startsWith('untrusted comment:')
            ? decoded.trim().replaceAll('\r', '')
            : `untrusted comment: tauri signing key\n${raw}`;
        }
        const lines = key.split('\n');
        if (lines.length !== 2 || !isBase64(lines[1]) || Buffer.from(lines[1], 'base64').length < 100) {
          throw new Error('Invalid updater signing key file; no key material will be logged.');
        }
        mask(lines[1]);
        mask(key);
        const encoded = Buffer.from(`${key}\n`).toString('base64');
        mask(encoded);
        const delimiter = `TAURI_PASSWORD_${randomUUID()}`;
        appendFileSync(process.env.GITHUB_ENV,
          `TAURI_SIGNING_PRIVATE_KEY=${encoded}\nTAURI_SIGNING_PRIVATE_KEY_PASSWORD<<${delimiter}\n${password}\n${delimiter}\n`);
        console.log('Required updater signing key prepared.');
        NODE
